name: CI/CD — Tests, Secret-Scan & Multi-Arch GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Automatisierte Tests
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit- und API-Tests ausführen
        run: npm test

  secret-scan:
    name: Secret-Scan (Git-History)
    runs-on: ubuntu-latest
    steps:
      - name: Vollständige Git-History auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks über gesamte History ausführen
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo \
            --verbose \
            --redact

  build-and-push:
    name: Multi-Arch Docker-Image bauen & nach GHCR pushen
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: QEMU für Multi-Arch (amd64 + arm64) einrichten
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry (ghcr.io) anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten & Tags erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/baniox/requirements-engine
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}

      - name: Multi-Arch-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
