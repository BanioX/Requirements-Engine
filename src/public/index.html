<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>ONESTRAND · Requirements Engine</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar no-print">
    <div class="shell topbar-inner">
      <a href="#" class="brand" id="brand-link" aria-label="ONESTRAND Requirements Engine">
        <span class="os-pill">
          <span class="os-mark" data-mark>
            <img src="/assets/mark.svg" alt="" width="34" height="22" />
            <canvas aria-hidden="true"></canvas>
          </span>
          <span class="brand-os">ONESTRAND</span>
        </span>
        <span class="brand-prod">Requirements Engine</span>
      </a>

      <div class="topbar-right">
        <div class="search-wrap" id="board-search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="filter-q" class="search" placeholder="Suchen" aria-label="Suchen" />
        </div>
        <button type="button" id="btn-install-app" class="quiet-btn hidden" title="Als Desktop-App installieren">Installieren</button>
        <button type="button" id="btn-toggle-report" class="quiet-btn">Manager-Report</button>
      </div>
    </div>
  </header>

  <main class="shell main-wrap">
    <div id="toast" class="toast hidden no-print" role="status" aria-live="polite"></div>

    <!-- ANSICHT A: ONESTRAND BOARD -->
    <div id="board-view">
      <form id="feedback-form" class="composer">
        <textarea
          id="fb-text"
          rows="2"
          required
          placeholder="Eingegangenes Feedback erfassen…"
        ></textarea>
        <div class="composer-bar">
          <div class="composer-left">
            <div class="channel-group" role="group" aria-label="Feedback-Kanal">
              <button type="button" class="ch-btn" data-channel="Persönlich" title="Live Feedback">Persönlich</button>
              <button type="button" class="ch-btn" data-channel="Telefon" title="Live Feedback">Telefon</button>
              <button type="button" class="ch-btn" data-channel="Chat" title="Live Feedback">Chat</button>
              <button type="button" class="ch-btn" data-channel="E-Mail" title="Zeitverzögertes Feedback">E-Mail</button>
            </div>
            <input type="text" id="fb-author" class="author-input" placeholder="Vorname Nachname" aria-label="Idee / Vorschlag von" />
            <input type="text" id="fb-ref" class="ref-input" placeholder="CRM / Ref-ID" aria-label="CRM- oder Ticket-Referenz (optional)" />
            <div id="composer-dur-slot"></div>
          </div>
          <button type="submit" class="btn-primary">Erfassen</button>
        </div>
        <div id="dup-banner" class="dup-banner hidden"></div>
      </form>

      <div class="filter-row">
        <div class="ampel-group" role="group" aria-label="Machbarkeit">
          <button type="button" class="ampel-btn active" data-ampel="alle">Alle <span id="count-all">0</span></button>
          <button type="button" class="ampel-btn" data-ampel="einfach"><span class="dot-sm dot-green"></span>Einfach <span id="count-green">0</span></button>
          <button type="button" class="ampel-btn" data-ampel="mittel"><span class="dot-sm dot-amber"></span>Mittel <span id="count-amber">0</span></button>
          <button type="button" class="ampel-btn" data-ampel="aufwaendig"><span class="dot-sm dot-red"></span>Aufwändig <span id="count-red">0</span></button>
        </div>
        <div class="status-group" role="group" aria-label="Status">
          <button type="button" class="st-btn active" data-mode="all">Alle</button>
          <button type="button" class="st-btn" data-mode="active">In Arbeit</button>
          <button type="button" class="st-btn" data-mode="done">Erledigt</button>
        </div>
      </div>

      <section id="ideas-list" class="ideas-list" aria-label="Feedback-Liste"></section>
    </div>

    <!-- ANSICHT B: MANAGEMENT-REPORT & PDF-EXPORT (01.01.XXXX – 31.12.XXXX) -->
    <section id="report-view" class="report-view hidden" aria-label="Management-Report">
      <div class="report-controls no-print">
        <div class="report-control-row">
          <div class="date-range">
            <input type="date" id="rep-from" aria-label="Von Datum" />
            <span class="sep">–</span>
            <input type="date" id="rep-to" aria-label="Bis Datum" />
            <button type="button" class="st-btn" id="rep-range-today">Heute</button>
            <button type="button" class="st-btn" id="rep-range-7d">7 T.</button>
            <button type="button" class="st-btn" id="rep-range-30d">30 T.</button>
            <button type="button" class="st-btn active" id="rep-year-curr">Jahr</button>
            <button type="button" class="st-btn" id="rep-year-prev">Vorjahr</button>
          </div>
          <div class="report-actions">
            <a href="/api/stories/export/csv" id="rep-csv-link" class="quiet-btn">Excel (CSV)</a>
            <button type="button" id="btn-export-pdf" class="btn-primary">PDF exportieren</button>
          </div>
        </div>

        <div class="report-control-row">
          <div class="status-group" id="rep-gran-pills" role="group" aria-label="Zeitauflösung">
            <button type="button" class="st-btn" data-rep-gran="day">Pro Tag</button>
            <button type="button" class="st-btn" data-rep-gran="week">Pro Woche</button>
            <button type="button" class="st-btn active" data-rep-gran="month">Pro Monat</button>
            <button type="button" class="st-btn" data-rep-gran="year">Pro Jahr</button>
          </div>

          <div class="ampel-group" id="rep-feas-pills" role="group" aria-label="Ampel Filter">
            <button type="button" class="ampel-btn active" data-rep-feas="Alle">Alle</button>
            <button type="button" class="ampel-btn" data-rep-feas="einfach"><span class="dot-sm dot-green"></span>Einfach</button>
            <button type="button" class="ampel-btn" data-rep-feas="mittel"><span class="dot-sm dot-amber"></span>Mittel</button>
            <button type="button" class="ampel-btn" data-rep-feas="aufwaendig"><span class="dot-sm dot-red"></span>Aufwändig</button>
          </div>

          <div class="status-group" id="rep-status-pills" role="group" aria-label="Status Filter">
            <button type="button" class="st-btn active" data-rep-status="Alle">Alle</button>
            <button type="button" class="st-btn" data-rep-status="Umgesetzt">Umgesetzt</button>
            <button type="button" class="st-btn" data-rep-status="In Arbeit">In Arbeit</button>
            <button type="button" class="st-btn" data-rep-status="Offen">Offen</button>
            <button type="button" class="st-btn" data-rep-status="Abgelehnt">Abgelehnt</button>
          </div>
        </div>

        <div class="report-control-row">
          <div class="status-group" id="rep-timemode-pills" role="group" aria-label="Zeitbasis">
            <span class="sep" style="font-size:0.75rem;">Zeitbasis:</span>
            <button type="button" class="st-btn active" data-rep-timemode="measured">Echt erfasst</button>
            <button type="button" class="st-btn" data-rep-timemode="projected">Hochrechnung (~)</button>
          </div>

          <div class="status-group hidden" id="rep-min-pills" role="group" aria-label="Fallback-Richtwert">
            <span class="sep" style="font-size:0.75rem;">Fallback falls leer:</span>
            <button type="button" class="st-btn active" data-rep-min="5">5m</button>
            <button type="button" class="st-btn" data-rep-min="10">10m</button>
            <button type="button" class="st-btn" data-rep-min="15">15m</button>
          </div>

          <div class="status-group" role="group" aria-label="Optionaler Stundensatz">
            <input type="number" id="rep-rate" class="ref-input" min="1" max="2000" step="5" placeholder="CHF / h" aria-label="Optionaler Stundensatz in CHF für Einsparungs-Nachweis" style="width:92px;" />
          </div>

          <div class="status-group" id="rep-vis-pills" role="group" aria-label="Kommentar-Sichtbarkeit">
            <span class="sep" style="font-size:0.75rem;">Kommentare:</span>
            <button type="button" class="st-btn active" data-vis="all">Alle sehen alle</button>
            <button type="button" class="st-btn" data-vis="own_only">Nur eigene (Chef alle)</button>
          </div>

          <button type="button" id="btn-chef-view" class="st-btn" title="Chef-Sicht auf dem Board umschalten">Chef-Sicht</button>
        </div>
      </div>

      <div id="report-sheet" class="report-sheet">Lade Report…</div>
    </section>
  </main>

  <footer class="ops-bar no-print" aria-label="Systemstatus">
    <div class="shell ops-inner">
      <span class="ops-item">
        <a href="https://onestrand.ch/" target="_blank" rel="noopener" class="ops-brand">ONESTRAND</a>
        <span>·</span>
        <span class="pulse-dot" id="ops-dot"></span>
        <span id="ops-db">DB…</span>
      </span>
      <span class="ops-item" id="ops-counts">0 Einträge</span>
      <span class="ops-item">
        <span id="ops-version">–</span>
        <code id="ops-commit">–</code>
        · <a href="/health" target="_blank" rel="noopener">/health</a>
      </span>
    </div>
  </footer>

  <script type="module" src="/assets/onestrand-mark.js"></script>
  <script src="/app.js"></script>
</body>
</html>
