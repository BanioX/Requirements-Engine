<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requirements Engine — Der geschlossene Feedback-Loop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-top">
        <div class="brand-line">Requirements Engine</div>
        <!-- 2-Wege-Sicht: Nutzersicht (öffentlich) vs. Betrieb (intern & vertraulich) -->
        <div class="origin-switch" role="group" aria-label="Ansichtsmodus">
          <button type="button" class="origin-btn active" data-view-mode="public">Nutzersicht</button>
          <button type="button" class="origin-btn" data-view-mode="internal">Betrieb (Intern)</button>
        </div>
      </div>
      <h1>Was sollen wir als Nächstes verbessern?</h1>
      <p class="lead">
        Idee einwerfen, gemeinsam hochvoten und live sehen, <strong>was mit deinem Feedback passiert</strong> — von der Prüfung bis zur Umsetzung oder ehrlichen Begründung.
      </p>
    </header>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- Ein einziges, idiotensicheres Eingabefeld — null Dropdowns -->
    <form id="feedback-form" class="composer">
      <div class="origin-switch" role="group" aria-label="Absender">
        <button type="button" class="origin-btn active" data-origin="kunde">Kunden-Feedback</button>
        <button type="button" class="origin-btn" data-origin="betrieb">Betrieb / Team</button>
      </div>
      <textarea
        id="fb-text"
        rows="3"
        required
        placeholder="Was führt oft zu Rückfragen, Tickets oder Aufwand? Einfach in einem Satz beschreiben…"
      ></textarea>
      <div class="composer-bar">
        <div class="inspiration">
          <span class="muted">Beispiel:</span>
          <button type="button" class="text-link" data-example="auszug">Auszug selbst erstellen</button>
          <button type="button" class="text-link" data-example="passwort">Login-Hilfe</button>
          <button type="button" class="text-link" data-example="status">Anfrage-Status</button>
        </div>
        <button type="submit" class="btn-primary">Feedback einreichen</button>
      </div>
      <div id="dup-banner" class="dup-banner hidden"></div>
    </form>

    <!-- 4 klare 1-Klick-Filter statt Dropdowns -->
    <div class="toolbar">
      <div class="segments" role="group" aria-label="Sortierung und Filter">
        <button type="button" class="seg active" data-mode="top">Beliebt</button>
        <button type="button" class="seg" data-mode="quickwins">Quick Wins</button>
        <button type="button" class="seg" data-mode="active">In Arbeit</button>
        <button type="button" class="seg" data-mode="done">Erledigt / Entschieden</button>
      </div>
      <input type="search" id="filter-q" class="search" placeholder="Suchen" aria-label="Feedback durchsuchen" />
    </div>

    <section id="ideas-list" class="ideas-list" aria-label="Feedback-Loop nach Nutzen und Machbarkeit">
      Lade Feedback…
    </section>
  </main>

  <!-- Feine, einzeilige Betriebs-Statuszeile für ATL-Nachweise -->
  <footer class="ops-bar" aria-label="Live-Betriebsstatus">
    <div class="shell ops-inner">
      <span class="ops-item"><span class="dot" id="ops-dot"></span><span id="ops-db">DB prüfe…</span></span>
      <span class="ops-item" id="ops-counts">–</span>
      <span class="ops-item">
        <span id="ops-version">–</span>
        <code id="ops-commit">–</code>
        · <a href="/health" target="_blank" rel="noopener">Health</a>
        · <a href="/api/stories/export/csv">CSV</a>
      </span>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
